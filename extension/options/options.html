<!doctype html>
<html lang="en">
<!-- Every word comes from _locales: data-i18n here (the kit's setUpPage fills it), the rest from options.js. -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="icon" href="../icons/icon-32.png">
  <link rel="stylesheet" href="../vendor/extension-kit/styles/chrome-ui.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-start">
      <img src="../icons/icon-48.png" alt="" width="24" height="24">
      <h1 data-i18n="extShortName"></h1>
    </div>
    <div class="toolbar-center"></div>
    <div class="toolbar-end">
      <span id="status" class="save-status secondary" role="status" aria-live="polite"></span>
    </div>
  </header>

  <main class="page">
    <h2 class="section-title" id="h-menu" data-i18n="optionsMenuHeading"></h2>
    <section class="card" aria-labelledby="h-menu">
      <p class="row text"><span class="label" id="menu-intro"></span></p>
      <div id="menu-items" class="menu-items"></div>
    </section>

    <h2 class="section-title" id="workspaces" data-i18n="optionsWorkspacesHeading"></h2>
    <section class="card" aria-labelledby="workspaces">
      <p id="no-workspaces" class="row text" hidden><span class="label" id="no-workspaces-text"></span></p>
      <ul id="workspace-list" class="list" aria-labelledby="workspaces"></ul>
      <p id="workspaces-full" class="row text" hidden><span class="label" id="workspaces-full-text"></span></p>
      <label class="row two-line">
        <span class="label">
          <span data-i18n="optionsReopenGroups"></span>
          <span class="secondary" data-i18n="optionsReopenGroupsSub"></span>
        </span>
        <input id="reopenGroups" type="checkbox" class="switch" role="switch">
      </label>
      <div class="row two-line">
        <span class="label">
          <span data-i18n="optionsTransfer"></span>
          <span class="secondary" data-i18n="optionsTransferSub"></span>
        </span>
        <span class="buttons">
          <button id="import-workspaces" type="button" data-i18n="optionsImport"></button>
          <button id="export-workspaces" type="button" data-i18n="optionsExport"></button>
        </span>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
      </div>
    </section>

    <h2 class="section-title" id="snapshots" data-i18n="optionsSnapshotsHeading"></h2>
    <section class="card" aria-labelledby="snapshots">
      <label class="row two-line">
        <span class="label">
          <span data-i18n="optionsAutoSnapshot"></span>
          <span class="secondary" data-i18n="optionsAutoSnapshotSub"></span>
        </span>
        <input id="autoSnapshot" type="checkbox" class="switch" role="switch">
      </label>
      <div id="auto-snapshot-options" class="row two-line" hidden>
        <label class="label" for="snapshotMinutes">
          <span data-i18n="optionsSnapshotEvery"></span>
          <span class="secondary" id="snapshot-every-sub"></span>
        </label>
        <select id="snapshotMinutes"></select>
      </div>
      <div class="row two-line">
        <span class="label">
          <span data-i18n="optionsSnapshotNow"></span>
          <span class="secondary" data-i18n="optionsSnapshotNowSub"></span>
        </span>
        <button id="take-snapshot" type="button" data-i18n="optionsTakeSnapshot"></button>
      </div>
      <p id="snapshot-problem" class="row text" role="status" hidden><span class="label" data-i18n="snapshotProblem"></span></p>
      <p id="snapshots-full" class="row text" hidden><span class="label" id="snapshots-full-text"></span></p>
      <ul id="snapshot-list" class="list" aria-labelledby="snapshots"></ul>
    </section>

    <h2 class="section-title" id="h-closing" data-i18n="optionsClosingHeading"></h2>
    <section class="card" aria-labelledby="h-closing">
      <div class="row two-line">
        <label class="label" for="windowScope">
          <span data-i18n="optionsWindows"></span>
          <span class="secondary" data-i18n="optionsWindowsSub"></span>
        </label>
        <select id="windowScope">
          <option value="window" data-i18n="optionsWindowsThis"></option>
          <option value="all" data-i18n="optionsWindowsAll"></option>
        </select>
      </div>
      <div class="row two-line">
        <label class="label" for="inactiveDays">
          <span data-i18n="optionsInactiveAfter"></span>
          <span class="secondary" data-i18n="optionsInactiveAfterSub"></span>
        </label>
        <span class="days"><input id="inactiveDays" type="number" min="1" max="365" step="1" inputmode="numeric"> <span id="days-unit"></span></span>
      </div>
      <label class="row two-line">
        <span class="label">
          <span data-i18n="optionsIncludeGrouped"></span>
          <span class="secondary" data-i18n="optionsIncludeGroupedSub"></span>
        </span>
        <input id="includeGroupedTabs" type="checkbox" class="switch" role="switch">
      </label>
      <label class="row two-line">
        <span class="label">
          <span data-i18n="optionsAutoClose"></span>
          <span class="secondary" data-i18n="optionsAutoCloseSub"></span>
        </span>
        <input id="autoClose" type="checkbox" class="switch" role="switch">
      </label>
      <div id="auto-close-options" hidden>
        <div class="row two-line">
          <label class="label" for="autoCloseHours">
            <span data-i18n="optionsAutoCloseAge"></span>
            <span class="secondary" data-i18n="optionsAutoCloseAgeSub"></span>
          </label>
          <select id="autoCloseHours"></select>
        </div>
        <div class="row">
          <span class="label" id="keep-sites-label" data-i18n="optionsKeepSites"></span>
          <button id="add-site" type="button" data-i18n="optionsAdd"></button>
        </div>
        <p id="no-sites" class="row text"><span class="label" data-i18n="optionsNoSites"></span></p>
        <ul id="site-list" class="list" aria-labelledby="keep-sites-label"></ul>
      </div>
      <button id="memory-saver" type="button" class="link-row external">
        <span class="label">
          <span data-i18n="optionsMemorySaver"></span>
          <span class="secondary" data-i18n="optionsMemorySaverSub"></span>
        </span>
      </button>
    </section>

    <h2 class="section-title" id="h-shortcuts" data-i18n="optionsShortcutsHeading"></h2>
    <section class="card" aria-labelledby="h-shortcuts">
      <div id="shortcuts"></div>
      <button id="edit-shortcuts" type="button" class="link-row external">
        <span class="label">
          <span data-i18n="optionsShortcutsHeading"></span>
          <span id="no-shortcuts" class="secondary" data-i18n="optionsNoShortcuts" hidden></span>
        </span>
      </button>
    </section>

    <!-- Copies chrome://settings/help ("About Chrome"); links come from about-links.js (githubAboutLinks). -->
    <h2 class="section-title" id="h-about" data-i18n="optionsAbout"></h2>
    <section class="card" aria-labelledby="h-about">
      <div class="row two-line about-product">
        <img src="../icons/icon-128.png" width="32" height="32" alt="">
        <span class="label product-title" data-i18n="extShortName"></span>
      </div>
      <div class="row">
        <span class="label"><span id="version" class="secondary"></span></span>
      </div>
      <a id="help" class="link-row external" target="_blank" rel="noopener">
        <span class="label" data-i18n="optionsGetHelp"></span>
      </a>
      <a id="report-issue" class="link-row external">
        <span class="label" data-i18n="optionsReportIssue"></span>
      </a>
      <a id="privacy-policy" class="link-row external" target="_blank" rel="noopener">
        <span class="label" data-i18n="optionsPrivacyPolicy"></span>
      </a>
    </section>
  </main>

  <!-- The ⋮ menus, the one-field dialog and the toast come from the kit (createMenu, askText, createToast);
       the import confirmation is confirm.js, on the kit's dialog styles. -->
  <script type="module" src="options.js"></script>
</body>
</html>
